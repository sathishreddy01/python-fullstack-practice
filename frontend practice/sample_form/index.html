<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: black;
      }

      .maincontainer {
        background-color: #32a869;
        margin-left: 300px;
        margin-right: 850px;
      }

      .subcontainer {
        background-color: white;
        padding: 20px;
        margin: 10px;
      }
      button {
        color: white;
        background-color: #32a869;
        font-size: larger;
      }
    </style>
  </head>
  <body>
    <div class="maincontainer">
      <div class="subcontainer">
        <form>
          <label for="name">Name </label><br />
          <input type="text" value="Enter your name" /><br /><br />
          <label for="email">Email</label><br />
          <input type="email" value="Enter your Email" /><br /><br />
          <label for="age">Age </label><br />
          <input type="number" /><br /><br />
          <label>Which option best describes you ??</label><br />
          <select>
            <option>student</option>
            <option>employee</option>
            <option>self employed</option></select
          ><br /><br />

          <label>Would you recommend GeekForGeeks for a Friend ??</label><br />
          <input type="radio" name="recommend" />YES<br />
          <input type="radio" name="recommend" />NO<br />
          <input type="radio" name="recommend" />MAY BE <br /><br />

          <label>Languages and frameworks known</label><br />
          <input type="checkbox" />C <br />
          <input type="checkbox" />C++ <br />
          <input type="checkbox" />C# <br />
          <input type="checkbox" />JAVA <br />
          <input type="checkbox" />PYTHON <br />
          <input type="checkbox" />JAVASCRIPT <br />
          <input type="checkbox" />REACT <br />
          <input type="checkbox" />ANGULAR <br />
          <input type="checkbox" />DJANGO <br />
          <input type="checkbox" />SPRING <br /><br />

          <label> Any comments or suggestions </label><br />
          <textarea></textarea><br /><br />

          <button><b>submit</b></button>
        </form>
      </div>
    </div>
  </body>
</html>
