<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SathishResto</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main">
      <div class="navbar">
        <div class="navbar-1">
          <div class="logo">SathishResto</div>
          <ul type="None" class="links">
            <li>Home</li>
            <li>Menu</li>
            <li>About</li>
            <li>Location</li>
            <li>Contact</li>
          </ul>
        </div>
        <div class="icons">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-solid fa-bars"></i>
        </div>
      </div>
      <div class="hero">
        <div class="left">
          <span class="left1">Are you Hungry?</span>
          <span class="left2">Don't wait</span>
          <span class="left3">Order your food now</span>
          <span class="left4">check out menu</span>
        </div>
        <div class="right" id="right"></div>
      </div>
      <div class="items">
        <div class="item1" id="item1"></div>
        <div class="item2" id="item2"></div>
        <div class="item3" id="item3"></div>
        <div class="item4" id="item4"></div>
      </div>
    </div>
    <script>
      let food = document.getElementById("right");
      let item1 = document.getElementById("item1");
      let item2 = document.getElementById("item2");
      let item3 = document.getElementById("item3");
      let item4 = document.getElementById("item4");

      item1.addEventListener("click", () => {
        food.style.backgroundImage = "url('images/food1.png')";
      });

      item2.addEventListener("click", () => {
        food.style.backgroundImage = "url('images/food2.png')";
      });

      item3.addEventListener("click", () => {
        food.style.backgroundImage = "url('images/food3.png')";
      });

      item4.addEventListener("click", () => {
        food.style.backgroundImage = "url('images/food4.png')";
      });
    </script>
  </body>
</html>
